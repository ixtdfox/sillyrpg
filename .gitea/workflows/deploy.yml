name: Deploy SillyRPG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: sillyrpg-deploy
    steps:
      - name: Build and deploy
        run: |
          set -eu

          workspace="${GITHUB_WORKSPACE:-$PWD}"
          rm -rf "$workspace/src"

          git clone http://127.0.0.1:3000/admin/sillyrpg.git "$workspace/src"
          cd "$workspace/src"
          git checkout "${GITHUB_SHA:-main}"

          npm ci
          npm run build

          rsync -az --delete \
            -e "ssh -i /root/.ssh/sillyrpg_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            dist/ root@192.168.1.125:/opt/sillyrpg/www/

          ssh -i /root/.ssh/sillyrpg_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@192.168.1.125 'mkdir -p /opt/sillyrpg/server /opt/sillyrpg/data'
          rsync -az \
            -e "ssh -i /root/.ssh/sillyrpg_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            server/sillyrpg-server.mjs root@192.168.1.125:/opt/sillyrpg/server/sillyrpg-server.mjs

          ssh -i /root/.ssh/sillyrpg_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@192.168.1.125 'bash -s' <<'REMOTE'
          set -eu

          if command -v docker >/dev/null 2>&1; then
            docker rm -f sillyrpg-nginx >/dev/null 2>&1 || true
          fi

          cat > /etc/systemd/system/sillyrpg.service <<'UNIT'
          [Unit]
          Description=SillyRPG production server
          After=network.target

          [Service]
          Type=simple
          Environment=PORT=3000
          Environment=SILLYRPG_WEB_ROOT=/opt/sillyrpg/www
          Environment=SILLYRPG_DATA_ROOT=/opt/sillyrpg/data
          WorkingDirectory=/opt/sillyrpg/server
          ExecStart=/usr/bin/node /opt/sillyrpg/server/sillyrpg-server.mjs
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable sillyrpg.service >/dev/null
          systemctl restart sillyrpg.service
          systemctl is-active sillyrpg.service
          REMOTE
